[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-skill"
version = "0.1.0"
description = "Agent skill that plans and renders domain-faithful PPTX, DOCX, XLSX, and PDF files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Office-Skill contributors" }]
dependencies = [
  "python-pptx==1.0.2",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "pypdf==6.21.4",
  "defusedxml==0.7.1",
  "lxml==6.1.3",
  "pandas==2.2.3",
  "typst==0.15.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.22"]
weasy = ["weasyprint==70.0"]

[project.scripts]
office-skill = "office_skill.cli:main"

[tool.setuptools.packages.find]
include = ["office_skill*", "engines*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
